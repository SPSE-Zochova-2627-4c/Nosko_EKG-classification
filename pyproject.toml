[project]
name = "ekg"
version = "0.1.0"
description = "Detekcia anomálií a multi-label klasifikácia 12-zvodového EKG (PTB-XL) – maturitný projekt"
readme = "README.md"
authors = [{ name = "Matúš Nosko" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # PyTorch už pre Intel Macy (x86_64) nevydáva verzie novšie ako 2.2.2.
    # Na Macu sa preto používa 2.2.2 (iba CPU, na vývoj a testy),
    # na Linuxe/Colabe novšia verzia (GPU prostredie rieši issue #28).
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # torch 2.2.2 je skompilovaný proti NumPy 1.x
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "wfdb>=4.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ekg-check = "ekg.check_env:main"
ekg-download = "ekg.data.download:main"
ekg-verify-data = "ekg.data.ptbxl:main"
ekg-labels = "ekg.data.labels:main"
ekg-splits = "ekg.data.splits:main"
ekg-preprocess = "ekg.preprocessing:main"
ekg-check-data = "ekg.data.check_pipeline:main"
ekg-ae-info = "ekg.models.autoencoder:main"
ekg-clf-info = "ekg.models.classifier:main"
ekg-train-ae = "ekg.training.train_autoencoder:main"
ekg-ae-report = "ekg.training.report_autoencoder:main"
ekg-calibrate-ae = "ekg.anomaly_threshold:main"
ekg-ae-analysis = "ekg.evaluation.ae_analysis:main"
ekg-quality = "ekg.quality:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
